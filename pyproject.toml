[project]
name = "layer-dynamics"
version = "0.1.0"
description = "Structured cross-layer propagation of features in transformers — diagnostic, characterization, and decomposition pipeline."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Aljaž Frančič" }]
keywords = ["mechanistic-interpretability", "transformers", "sparse-autoencoders", "residual-stream"]

# Python capped below 3.13: the torch 2.5 line (held below) ships no 3.13/3.14
# wheels, and the local dev box (see docs/implementation-plan Phase 1 Step 0)
# runs the pipeline on a 3.12 interpreter managed by uv.
requires-python = ">=3.11,<3.13"

# Core dependencies for Phase 1 (diagnostic) onward. Versions are pinned to a
# compatible-release range; the exact resolution is captured in the lockfile
# (uv.lock) generated on the run environment. See docs/implementation-plan
# Phase 1 Step 0 for the rationale behind each.
dependencies = [
    # Held to the 2.5 series on purpose: the local GPU is a GTX 1050 (Pascal,
    # compute capability 6.1), and torch 2.6+ began dropping Pascal/Maxwell from
    # the default CUDA wheels. 2.5.x still ships sm_6x kernels. Routed to the
    # cu124 wheel index in [tool.uv.sources] below.
    "torch~=2.5.0",          # model forward passes via TransformerLens
    "transformer-lens~=2.8", # residual-stream hooks, model loading
    # transformer-lens 2.x uses transformers.TRANSFORMERS_CACHE, removed in
    # transformers 5.0 — hold transformers on the 4.x line.
    "transformers>=4.44,<5",
    "datasets~=3.2",         # CounterFact / Pararel / T-REx loading
    "numpy~=2.1",
    "scipy~=1.14",
    "scikit-learn~=1.5",     # Ridge, Lasso, CCA, truncated SVD
    "statsmodels~=0.14",     # VAR / Granger causality
    "h5py~=3.12",            # residual_stream[N, L+1, D] storage
    "safetensors~=0.4",      # alternative activation storage
    "matplotlib~=3.9",
    "pandas~=2.2",           # filtered_triples.parquet, result tables
    "pyarrow~=23.0",         # parquet engine for pandas
    "pyyaml~=6.0",           # run configs
    "tqdm~=4.66",
]

[project.optional-dependencies]
# Regularised / kernel / deep CCA variants — Phase 1 Step 4 backstop.
cca = ["cca-zoo~=2.5"]
# Tuned Lens baseline — Phase 1 Step 3 gate baseline.
lens = ["tuned-lens~=0.2"]
dev = ["pytest~=9.0", "ruff~=0.8"]

[project.scripts]
layer-dynamics = "layer_dynamics.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/layer_dynamics"]

[tool.ruff]
line-length = 100
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Route torch to the CUDA 12.4 wheel index (Pascal-compatible 2.5.x builds).
# `explicit = true` means only packages pinned to it in [tool.uv.sources] are
# fetched here; everything else resolves from PyPI. To build for CPU-only or a
# different CUDA version, change the url (e.g. .../whl/cpu) and re-run `uv sync`.
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
