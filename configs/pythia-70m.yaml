# Fast dev lane — Pythia-70m (D=512, L=6).
# NOT a scientific target: 6 layers is too shallow for the depth-dynamics
# analysis (banded stationarity, k* sweep). Used to shake out pipeline bugs in
# seconds before running the same code on the pythia-410m primary config, and
# as the Phase 3 debug pass the plan already calls for.

model:
  name: pythia-70m-deduped
  device: auto
  dtype: float32

dataset:
  sources: [counterfact]
  top1_prob_threshold: 0.3
  min_examples_per_relation: 100    # smaller floor; this is a debug subset
  target_size: 1000

filtering:
  batch_size: 64                    # tiny model

collection:
  token_position: final_prompt
  batch_size: 16                    # tiny model, peaks well under 1 GB
  hook_points: [resid_pre_0, resid_post]
