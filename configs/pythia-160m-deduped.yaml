# Cross-model in-family depth midpoint — Pythia-160m-deduped (D=768, L=12).
# Fills the depth-scaling curve between 70m (6L) and 410m (24L): the Gate-3
# cross-layer gap grew 3-6x from 6 to 24 layers; 12 layers tests monotonicity.
# Same family as the primary, so it controls for arch/data confounds. Public
# per-layer residual SAEs exist in the same MLSAE suite (drop-in to saes_mlsae).
# Fits the 3 GB GPU in fp32 easily (~0.6 GB params).
#
# tuned_lens omitted on purpose: it is only the Phase-1 gate baseline (already
# cleared on 410m) and confirmatory for a replication — leaving it out keeps an
# unattended run robust. Add `tuned_lens: {resource_id: EleutherAI/pythia-160m-deduped}`
# if the ridge-vs-lens comparison is wanted.

model:
  name: pythia-160m-deduped
  device: auto
  dtype: float32

dataset:
  sources: [counterfact]
  # 160m knows fewer facts than 410m (~2000); keep the threshold low and the floor
  # small so 3 relation classes survive (yield reported at build time).
  top1_prob_threshold: 0.1
  min_examples_per_relation: 150
  target_size: 5000

filtering:
  batch_size: 64

collection:
  token_position: final_prompt
  batch_size: 16                    # smaller than 410m; peaks well under 1 GB
  hook_points: [resid_pre_0, resid_post]   # v_0 plus v_1..v_L

diagnostics:
  ranks: [16, 32, 64, 128]
  test_frac: 0.2
  cca_components: 10
  cca_shrinkage: 0.1
  cca_null: true
  ar_lags: [1, 2, 3, 5, 8, 10]      # capped < n_delta = L = 12 (lags 15/20 infeasible here)
  ar_input_pcs: 256
  granger_pca: 32
  ar_null_seed: 1234
  stationarity_n_boot: 200
  stationarity_boot_seed: 20260622
